name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The collab-persistence integration test spawns a REAL
      # jupyter-collaboration server via `uv run`. Provide uv + Python and
      # pre-warm the package cache so the in-test spawn is fast and reliable.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Prime jupyter-collaboration (uv cache)
        run: uv run --with jupyterlab --with jupyter-collaboration python -c "import jupyter_collaboration, pycrdt; print(jupyter_collaboration.__version__, pycrdt.__version__)"

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm run test

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: cd python && uv sync

      - name: Run tests
        run: cd python && uv run pytest tests/ -v

      - name: Run mypy
        run: cd python && uv run mypy src/

      - name: Run ruff
        run: cd python && uv run ruff check src/
